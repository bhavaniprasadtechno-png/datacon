<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="30" y="24" fill="white" font-size="17" font-weight="700">Final: self-contained dashlet &#8212; no FK, no Message dependency</text>
  <text x="30" y="40" fill="#94a3b8" font-size="8.5">The browser already holds the full computed payload the instant chat finishes &#8212; save just copies it. Dashlet never points at anything.</text>

  <!-- Save -->
  <text x="30" y="76" fill="white" font-size="13" font-weight="700">Save (&quot;Add to dashboard&quot;)</text>

  <line x1="140" y1="98" x2="140" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="420" y1="98" x2="420" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="900" y1="98" x2="900" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="65" y="90" width="150" height="30" rx="5" fill="#0f172a"/>
  <rect x="65" y="90" width="150" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="109" fill="white" font-size="9.5" font-weight="600" text-anchor="middle">Browser</text>

  <rect x="345" y="90" width="150" height="30" rx="5" fill="#0f172a"/>
  <rect x="345" y="90" width="150" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="420" y="109" fill="white" font-size="9.5" font-weight="600" text-anchor="middle">NestJS API</text>

  <rect x="825" y="90" width="150" height="30" rx="5" fill="#0f172a"/>
  <rect x="825" y="90" width="150" height="30" rx="5" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="900" y="109" fill="white" font-size="9.5" font-weight="600" text-anchor="middle">Postgres</text>

  <line x1="140" y1="150" x2="420" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="143" fill="#e2e8f0" font-size="8.5" text-anchor="middle">POST /dashboards/save</text>
  <text x="280" y="164" fill="#e2e8f0" font-size="8" text-anchor="middle" font-style="italic">{ title, text, intent, payload } &#8212; already in memory, no extra fetch</text>

  <line x1="420" y1="180" x2="900" y2="180" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="660" y="174" fill="#a7f3d0" font-size="8.5" text-anchor="middle">INSERT Dashlet { title, text, intent, payload } &#8212; a plain copy, no FK</text>

  <line x1="420" y1="199" x2="140" y2="199" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="280" y="216" fill="#a7f3d0" font-size="8.5" text-anchor="middle">201 &#8212; done. No AI call. No dependency on Message.id, ever.</text>

  <!-- View -->
  <text x="30" y="260" fill="white" font-size="13" font-weight="700">View dashboard</text>

  <line x1="140" y1="282" x2="140" y2="374" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="420" y1="282" x2="420" y2="374" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="900" y1="282" x2="900" y2="374" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <rect x="65" y="274" width="150" height="30" rx="5" fill="#0f172a"/>
  <rect x="65" y="274" width="150" height="30" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="293" fill="white" font-size="9.5" font-weight="600" text-anchor="middle">Browser</text>

  <rect x="345" y="274" width="150" height="30" rx="5" fill="#0f172a"/>
  <rect x="345" y="274" width="150" height="30" rx="5" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="420" y="293" fill="white" font-size="9.5" font-weight="600" text-anchor="middle">NestJS API</text>

  <rect x="825" y="274" width="150" height="30" rx="5" fill="#0f172a"/>
  <rect x="825" y="274" width="150" height="30" rx="5" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="900" y="293" fill="white" font-size="9.5" font-weight="600" text-anchor="middle">Postgres</text>

  <line x1="140" y1="330" x2="420" y2="330" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="323" fill="#e2e8f0" font-size="8.5" text-anchor="middle">GET /dashboards/:id</text>

  <line x1="420" y1="352" x2="900" y2="352" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="660" y="345" fill="#a7f3d0" font-size="8.5" text-anchor="middle">SELECT * FROM dashlets WHERE dashboardId = :id</text>

  <line x1="420" y1="371" x2="140" y2="371" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="280" y="388" fill="#a7f3d0" font-size="8.5" text-anchor="middle">rows, rendered via existing AgentVisualization &#8212; no join, no AI call</text>

  <!-- schema -->
  <rect x="30" y="420" width="1060" height="120" rx="8" fill="#0f172a"/>
  <rect x="30" y="420" width="1060" height="120" rx="8" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="46" y="442" fill="white" font-size="10.5" font-weight="700">Dashlet schema (final)</text>
  <text x="46" y="462" fill="#a7f3d0" font-size="9" font-family="monospace">id, orgId, dashboardId, title, text, intent, payload (Json), createdAt</text>
  <text x="46" y="482" fill="#94a3b8" font-size="8.5">No messageId, no FK to Message, no question/model/sql. Fully independent &#8212; deleting the source chat conversation never touches a saved dashlet.</text>
  <text x="46" y="500" fill="#94a3b8" font-size="8.5">Frozen at save time (same trade-off as before): a dashlet shows the numbers as they were when you saved it, not live data.</text>
  <text x="46" y="522" fill="white" font-size="8.5" font-weight="700">This is what Tasks 1-8 already built today, minus: the question/model fields, and detail()'s AI-service live-refresh call.</text>

  <!-- what's reverted -->
  <rect x="30" y="560" width="1060" height="110" rx="8" fill="#0f172a"/>
  <rect x="30" y="560" width="1060" height="110" rx="8" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="46" y="582" fill="#fbbf24" font-size="10.5" font-weight="700">Reverting (no longer used by anything)</text>
  <text x="46" y="602" fill="#e2e8f0" font-size="8.5">&#8226; app/ai executor.py + all 4 analysts: the optional &quot;sql&quot; param and payload[&quot;sql&quot;] caching &#8212; today's detour, now dead code.</text>
  <text x="46" y="618" fill="#e2e8f0" font-size="8.5">&#8226; app/ai chat_router.py: the /internal/chat/answer route entirely &#8212; nothing calls it once detail() stops hitting the AI service.</text>
  <text x="46" y="634" fill="#e2e8f0" font-size="8.5">&#8226; DashboardsService: AiClientService dependency, the live-refresh try/catch, the &quot;stale&quot; field.</text>
  <text x="46" y="650" fill="#e2e8f0" font-size="8.5">&#8226; Prisma: Dashlet.question and Dashlet.model columns (title/text/intent/payload stay as originally built).</text>

  <text x="30" y="700" fill="white" font-size="11" font-weight="700">Net result: save = one INSERT with data already in the browser's hand. View = one SELECT. Zero AI-service involvement, either way.</text>
</svg>
