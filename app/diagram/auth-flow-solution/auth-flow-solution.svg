<svg viewBox="0 0 1060 770" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- ============================================================ -->
  <!-- SECTION A: AFTER — fixed request flow (sequence diagram)     -->
  <!-- ============================================================ -->

  <text x="20" y="16" fill="white" font-size="15" font-weight="700">AFTER — Fixed Flow (asymmetric ES256 signing key)</text>

  <!-- lifelines -->
  <line x1="110" y1="72" x2="110" y2="500" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="300" y1="72" x2="300" y2="500" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="490" y1="72" x2="490" y2="500" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="680" y1="72" x2="680" y2="500" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="870" y1="72" x2="870" y2="500" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- msg1: Browser -> Guards -->
  <circle cx="95" cy="112" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="95" y="115" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">1</text>
  <line x1="110" y1="112" x2="300" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="104" fill="#e2e8f0" font-size="9" text-anchor="middle">GET /documents  (Bearer &lt;jwt&gt;)</text>

  <!-- msg2: local verify self-loop on Guards (green, fast) -->
  <path d="M 300,150 L 360,150 L 360,196 L 300,196" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <circle cx="285" cy="150" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="285" y="153" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">2</text>
  <text x="368" y="158" fill="#6ee7b7" font-size="8.5" font-weight="600">auth.getClaims(token)</text>
  <text x="368" y="171" fill="#6ee7b7" font-size="8">verify locally — Web Crypto</text>
  <text x="368" y="184" fill="#6ee7b7" font-size="8">using cached JWKS public key</text>
  <text x="368" y="197" fill="#6ee7b7" font-size="8.5" font-weight="700">no network call — ~2ms ✓</text>

  <!-- faint note: JWKS fetch is rare & cached, not on critical path -->
  <line x1="312" y1="214" x2="490" y2="214" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="315" y="209" fill="#64748b" font-size="7.5" text-anchor="start" font-style="italic">JWKS fetch — rare, cached in-memory, not per-request</text>

  <!-- msg3: Guards -> Postgres DB -->
  <circle cx="315" cy="240" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="315" y="243" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">3</text>
  <line x1="300" y1="240" x2="680" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="232" fill="#e2e8f0" font-size="8.5" text-anchor="middle">prisma.user.findUnique({ include: role.permissions, org })</text>

  <!-- Postgres DB activation bar 1 -->
  <rect x="675" y="240" width="10" height="40" rx="2" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1"/>

  <!-- msg4: DB --> Guards (return) -->
  <circle cx="695" cy="280" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="695" y="283" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">4</text>
  <line x1="680" y1="280" x2="300" y2="280" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="490" y="272" fill="#c4b5fd" font-size="8.5" text-anchor="middle" font-style="italic">user + role.permissions + org.status</text>

  <!-- note: suspended check / attach req.user -->
  <rect x="320" y="292" width="230" height="32" rx="4" fill="rgba(30,41,59,0.85)" stroke="#64748b" stroke-width="1"/>
  <text x="435" y="306" fill="#cbd5e1" font-size="8" text-anchor="middle">check suspended (user / org)</text>
  <text x="435" y="318" fill="#cbd5e1" font-size="8" text-anchor="middle">attach req.user = { id, orgId, permissions }</text>

  <!-- msg5: PermissionsGuard self-loop -->
  <path d="M 300,342 L 350,342 L 350,374 L 300,374" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <circle cx="285" cy="342" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="285" y="345" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">5</text>
  <text x="358" y="350" fill="#6ee7b7" font-size="8.5" font-weight="600">PermissionsGuard.canActivate()</text>
  <text x="358" y="363" fill="#6ee7b7" font-size="8">Reflector metadata check</text>
  <text x="358" y="375" fill="#6ee7b7" font-size="8" font-weight="700">in-memory, no I/O — ~0ms ✓</text>

  <!-- msg6: Guards -> Service -->
  <circle cx="315" cy="404" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="315" y="407" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">6</text>
  <line x1="300" y1="404" x2="870" y2="404" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="396" fill="#e2e8f0" font-size="8.5" text-anchor="middle">handler(user) → DocumentsService.list(orgId)</text>

  <!-- msg7: Service -> DB -->
  <circle cx="695" cy="430" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="695" y="433" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">7</text>
  <line x1="870" y1="430" x2="680" y2="430" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="775" y="422" fill="#e2e8f0" font-size="8.5" text-anchor="middle">scoped query (org-filtered, fast)</text>

  <!-- Postgres DB activation bar 2 -->
  <rect x="675" y="430" width="10" height="34" rx="2" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1"/>

  <!-- msg8: DB --> Service (return) -->
  <circle cx="695" cy="464" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="695" y="467" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">8</text>
  <line x1="680" y1="464" x2="870" y2="464" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="775" y="456" fill="#c4b5fd" font-size="8.5" text-anchor="middle" font-style="italic">rows</text>

  <!-- msg9: Service --> Browser (final return) -->
  <circle cx="855" cy="486" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="855" y="489" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">9</text>
  <line x1="870" y1="486" x2="110" y2="486" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Guards activation bar (drawn after messages so it doesn't cover text) -->
  <rect x="295" y="112" width="10" height="292" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>

  <!-- Service activation bar -->
  <rect x="865" y="404" width="10" height="82" rx="2" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1"/>

  <!-- total time banner -->
  <rect x="20" y="500" width="1000" height="30" rx="6" fill="rgba(6,78,59,0.18)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="519" fill="#6ee7b7" font-size="9.5" font-weight="700" text-anchor="middle">Total request time ≈ 20–60ms — no external network hop. Local JWT verification + fast DB queries only.</text>

  <!-- actor boxes (drawn last, on top) -->
  <rect x="35" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="35" y="20" width="150" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="110" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <text x="110" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">web/ (React app)</text>

  <rect x="225" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="225" y="20" width="150" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="40" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">SupabaseAuthGuard</text>
  <text x="300" y="52" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">+ PermissionsGuard</text>
  <text x="300" y="65" fill="#94a3b8" font-size="8" text-anchor="middle">api/src/auth/guards</text>

  <rect x="415" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="415" y="20" width="150" height="52" rx="6" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1.5"/>
  <text x="490" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">Supabase Auth</text>
  <text x="490" y="58" fill="#6ee7b7" font-size="8.5" text-anchor="middle">not on critical path now</text>

  <rect x="605" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="605" y="20" width="150" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="680" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">Postgres (Prisma)</text>
  <text x="680" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">users / roles / documents</text>

  <rect x="795" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="795" y="20" width="150" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="870" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">DocumentsService</text>
  <text x="870" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">(same for Users/Roles/etc.)</text>

  <!-- divider -->
  <line x1="20" y1="552" x2="1020" y2="552" stroke="#334155" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- SECTION B: HOW TO GET THERE — key migration steps            -->
  <!-- ============================================================ -->

  <text x="20" y="578" fill="white" font-size="14" font-weight="700">HOW TO GET THERE — Supabase Dashboard → Project Settings → JWT Keys</text>

  <!-- step boxes -->
  <rect x="40" y="602" width="190" height="60" rx="8" fill="#0f172a"/>
  <rect x="40" y="602" width="190" height="60" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="135" y="625" fill="white" font-size="10.5" font-weight="700" text-anchor="middle">1. Migrate</text>
  <text x="135" y="639" fill="#fde68a" font-size="8" text-anchor="middle">imports legacy HS256</text>
  <text x="135" y="651" fill="#fde68a" font-size="8" text-anchor="middle">secret • no behavior change</text>

  <line x1="230" y1="632" x2="266" y2="632" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <rect x="270" y="602" width="210" height="60" rx="8" fill="#0f172a"/>
  <rect x="270" y="602" width="210" height="60" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="375" y="622" fill="white" font-size="10" font-weight="700" text-anchor="middle">2. Create standby key</text>
  <text x="375" y="636" fill="#fde68a" font-size="8" text-anchor="middle">algorithm: ES256</text>
  <text x="375" y="650" fill="#fde68a" font-size="8" text-anchor="middle">state: Standby (unused)</text>

  <line x1="480" y1="632" x2="516" y2="632" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <rect x="520" y="602" width="220" height="60" rx="8" fill="#0f172a"/>
  <rect x="520" y="602" width="220" height="60" rx="8" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
  <text x="630" y="622" fill="white" font-size="10" font-weight="700" text-anchor="middle">3. Rotate</text>
  <text x="630" y="636" fill="#6ee7b7" font-size="8" text-anchor="middle">new key: Standby → In Use</text>
  <text x="630" y="650" fill="#6ee7b7" font-size="8" text-anchor="middle">old key: In Use → Previously Used</text>

  <line x1="740" y1="632" x2="776" y2="632" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <rect x="780" y="602" width="220" height="60" rx="8" fill="#0f172a"/>
  <rect x="780" y="602" width="220" height="60" rx="8" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="890" y="622" fill="white" font-size="10" font-weight="700" text-anchor="middle">4. Revoke old key</text>
  <text x="890" y="636" fill="#fda4af" font-size="8" text-anchor="middle">manual step — not automatic</text>
  <text x="890" y="650" fill="#fda4af" font-size="8" text-anchor="middle">wait &gt; token TTL first</text>

  <!-- wait annotation between 3 and 4 -->
  <rect x="700" y="674" width="220" height="20" rx="4" fill="rgba(30,41,59,0.85)" stroke="#64748b" stroke-width="1"/>
  <text x="810" y="688" fill="#cbd5e1" font-size="8" text-anchor="middle">wait ≥ 1h15m if token TTL = 1h (no forced sign-outs)</text>

  <!-- new tokens signed with which key -->
  <text x="135" y="672" fill="#94a3b8" font-size="7.5" text-anchor="middle" font-style="italic">no downtime, no behavior change</text>
  <text x="375" y="672" fill="#94a3b8" font-size="7.5" text-anchor="middle" font-style="italic">key generated, not yet used</text>
  <text x="630" y="672" fill="#6ee7b7" font-size="7.5" text-anchor="middle" font-style="italic">new JWTs now signed ES256 → getClaims() verifies locally</text>

  <!-- footer note -->
  <rect x="20" y="712" width="1000" height="46" rx="6" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>
  <text x="35" y="730" fill="#cbd5e1" font-size="8.5">✓ Reversible: any key can be moved back to Standby from Previously Used / Revoked if something goes wrong mid-migration.</text>
  <text x="35" y="745" fill="#cbd5e1" font-size="8.5">✓ Zero code changes: api/src/auth/guards/supabase-auth.guard.ts already calls getClaims() — it auto-detects the JWT's alg header.</text>

</svg>
