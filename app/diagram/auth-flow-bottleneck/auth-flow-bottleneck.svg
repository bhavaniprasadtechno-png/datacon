<svg viewBox="0 0 1060 800" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. bottleneck region highlight -->
  <rect x="245" y="136" width="340" height="200" rx="10" fill="rgba(136,19,55,0.18)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="249" y="136" width="110" height="16" rx="4" fill="rgba(30,41,59,0.9)" stroke="#fb7185" stroke-width="1"/>
  <text x="304" y="148" fill="#fb7185" font-size="8.5" font-weight="700" text-anchor="middle">BOTTLENECK</text>

  <!-- 3. lifelines -->
  <line x1="110" y1="72" x2="110" y2="700" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="300" y1="72" x2="300" y2="700" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="490" y1="72" x2="490" y2="700" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="680" y1="72" x2="680" y2="700" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="870" y1="72" x2="870" y2="700" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===================== MESSAGES ===================== -->

  <!-- msg1: Browser -> Guards -->
  <circle cx="95" cy="120" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="95" y="123" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">1</text>
  <line x1="110" y1="120" x2="300" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="112" fill="#e2e8f0" font-size="9" text-anchor="middle">GET /documents  (Bearer &lt;jwt&gt;)</text>

  <!-- msg2: Guards -> Supabase Auth -->
  <circle cx="285" cy="178" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="285" y="181" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">2</text>
  <line x1="300" y1="178" x2="490" y2="178" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="395" y="170" fill="#fda4af" font-size="9" text-anchor="middle">auth.getClaims(token)</text>

  <!-- explanatory note inside bottleneck box -->
  <text x="395" y="200" fill="#fda4af" font-size="8" text-anchor="middle" font-style="italic">HS256 (symmetric) signing key</text>
  <text x="395" y="214" fill="#fda4af" font-size="8" text-anchor="middle" font-style="italic">→ can't verify JWT locally via JWKS</text>
  <text x="395" y="228" fill="#fda4af" font-size="8" text-anchor="middle" font-style="italic">→ falls back to getUser(token)</text>
  <text x="395" y="244" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">⏱ real network round-trip</text>

  <!-- Supabase Auth activation bar -->
  <rect x="485" y="178" width="10" height="116" rx="2" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1"/>

  <!-- msg3: Supabase Auth --> Guards (return) -->
  <circle cx="505" cy="294" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="505" y="297" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">3</text>
  <line x1="490" y1="294" x2="300" y2="294" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-rose)"/>
  <text x="395" y="286" fill="#fda4af" font-size="8" text-anchor="middle" font-style="italic">claims { sub: userId }</text>
  <rect x="330" y="302" width="130" height="16" rx="8" fill="rgba(136,19,55,0.45)" stroke="#fb7185" stroke-width="1"/>
  <text x="395" y="313" fill="#ffe4e6" font-size="8" font-weight="700" text-anchor="middle">~1.1–1.2s SLOW ⚠</text>

  <!-- msg4: Guards -> Postgres DB -->
  <circle cx="315" cy="360" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="315" y="363" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">4</text>
  <line x1="300" y1="360" x2="680" y2="360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="352" fill="#e2e8f0" font-size="8.5" text-anchor="middle">prisma.user.findUnique({ include: role.permissions, org })</text>

  <!-- Postgres DB activation bar 1 -->
  <rect x="675" y="360" width="10" height="46" rx="2" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1"/>

  <!-- msg5: DB --> Guards (return) -->
  <circle cx="695" cy="406" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="695" y="409" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">5</text>
  <line x1="680" y1="406" x2="300" y2="406" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="490" y="398" fill="#c4b5fd" font-size="8.5" text-anchor="middle" font-style="italic">user + role.permissions + org.status</text>

  <!-- note: suspended check / attach req.user -->
  <rect x="320" y="418" width="230" height="32" rx="4" fill="rgba(30,41,59,0.85)" stroke="#64748b" stroke-width="1"/>
  <text x="435" y="432" fill="#cbd5e1" font-size="8" text-anchor="middle">check suspended (user / org)</text>
  <text x="435" y="444" fill="#cbd5e1" font-size="8" text-anchor="middle">attach req.user = { id, orgId, permissions }</text>

  <!-- msg6: PermissionsGuard self-loop on Guards lifeline -->
  <path d="M 300,468 L 350,468 L 350,500 L 300,500" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <circle cx="285" cy="468" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="285" y="471" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">6</text>
  <text x="358" y="476" fill="#6ee7b7" font-size="8.5" font-weight="600">PermissionsGuard.canActivate()</text>
  <text x="358" y="489" fill="#6ee7b7" font-size="8">Reflector metadata check</text>
  <text x="358" y="501" fill="#6ee7b7" font-size="8" font-weight="700">in-memory, no I/O — ~0ms ✓</text>

  <!-- msg7: Guards -> Service -->
  <circle cx="315" cy="534" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="315" y="537" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">7</text>
  <line x1="300" y1="534" x2="870" y2="534" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="526" fill="#e2e8f0" font-size="8.5" text-anchor="middle">handler(user) → DocumentsService.list(orgId)</text>

  <!-- Service activation bar -->
  <rect x="865" y="534" width="10" height="116" rx="2" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1"/>

  <!-- msg8: Service -> DB -->
  <circle cx="695" cy="568" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="695" y="571" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">8</text>
  <line x1="870" y1="568" x2="680" y2="568" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="775" y="560" fill="#e2e8f0" font-size="8.5" text-anchor="middle">scoped query (org-filtered, fast)</text>

  <!-- Postgres DB activation bar 2 -->
  <rect x="675" y="568" width="10" height="38" rx="2" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1"/>

  <!-- msg9: DB --> Service (return) -->
  <circle cx="695" cy="606" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="695" y="609" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">9</text>
  <line x1="680" y1="606" x2="870" y2="606" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="775" y="598" fill="#c4b5fd" font-size="8.5" text-anchor="middle" font-style="italic">rows</text>

  <!-- msg10: Service --> Browser (final return) -->
  <circle cx="855" cy="650" r="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="855" y="653" fill="#60a5fa" font-size="7" font-weight="600" text-anchor="middle">10</text>
  <line x1="870" y1="650" x2="110" y2="650" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="490" y="642" fill="#94a3b8" font-size="8.5" text-anchor="middle" font-style="italic">200 OK — JSON response</text>

  <!-- total time annotation -->
  <rect x="20" y="666" width="1000" height="30" rx="6" fill="rgba(136,19,55,0.15)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="685" fill="#fda4af" font-size="9.5" font-weight="700" text-anchor="middle">Total request time ≈ 1.1–1.2s — almost entirely step 2→3 (Supabase Auth network round-trip). Steps 4–9 (DB + business logic) are fast.</text>

  <!-- ===================== ACTIVATION BAR (guards, drawn after messages) ===================== -->
  <rect x="295" y="120" width="10" height="414" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>

  <!-- ===================== ACTOR BOXES (masked + drawn on top) ===================== -->
  <!-- Browser -->
  <rect x="35" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="35" y="20" width="150" height="52" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="110" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <text x="110" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">web/ (React app)</text>

  <!-- NestJS Guards -->
  <rect x="225" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="225" y="20" width="150" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="40" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">SupabaseAuthGuard</text>
  <text x="300" y="52" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">+ PermissionsGuard</text>
  <text x="300" y="65" fill="#94a3b8" font-size="8" text-anchor="middle">api/src/auth/guards</text>

  <!-- Supabase Auth Server -->
  <rect x="415" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="415" y="20" width="150" height="52" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="490" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">Supabase Auth</text>
  <text x="490" y="58" fill="#fda4af" font-size="8.5" text-anchor="middle">external network (GoTrue)</text>

  <!-- Postgres DB -->
  <rect x="605" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="605" y="20" width="150" height="52" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="680" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">Postgres (Prisma)</text>
  <text x="680" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">users / roles / documents</text>

  <!-- Service -->
  <rect x="795" y="20" width="150" height="52" rx="6" fill="#0f172a"/>
  <rect x="795" y="20" width="150" height="52" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="870" y="43" fill="white" font-size="11" font-weight="600" text-anchor="middle">DocumentsService</text>
  <text x="870" y="58" fill="#94a3b8" font-size="8.5" text-anchor="middle">(same for Users/Roles/etc.)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="20" y="706" width="1000" height="76" rx="8" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>
  <text x="35" y="724" fill="#e2e8f0" font-size="9" font-weight="700">Legend</text>

  <line x1="35" y1="738" x2="65" y2="738" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="72" y="741" fill="#cbd5e1" font-size="8">sync call</text>

  <line x1="150" y1="738" x2="180" y2="738" stroke="#64748b" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="187" y="741" fill="#cbd5e1" font-size="8">return</text>

  <rect x="255" y="732" width="16" height="12" rx="2" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1"/>
  <text x="278" y="741" fill="#cbd5e1" font-size="8">network round-trip (slow, external)</text>

  <rect x="475" y="732" width="16" height="12" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>
  <text x="498" y="741" fill="#cbd5e1" font-size="8">in-process guard chain (fast)</text>

  <rect x="700" y="732" width="16" height="12" rx="2" fill="rgba(76,29,149,0.5)" stroke="#a78bfa" stroke-width="1"/>
  <text x="723" y="741" fill="#cbd5e1" font-size="8">database query (fast)</text>

  <text x="35" y="762" fill="#94a3b8" font-size="8" font-style="italic">Root cause: project uses legacy HS256 (symmetric) JWT signing → getClaims() can't verify locally → falls back to network getUser() call on EVERY request, for EVERY route.</text>
  <text x="35" y="775" fill="#94a3b8" font-size="8" font-style="italic">Fix: migrate to asymmetric (ES256) signing keys in Supabase — getClaims() then verifies locally via cached JWKS, eliminating the round-trip.</text>

  <!-- ===================== TITLE ===================== -->
  <text x="20" y="16" fill="white" font-size="15" font-weight="700">Current API Request Flow — Root Cause of ~1.1s Latency on Every Call</text>
</svg>
