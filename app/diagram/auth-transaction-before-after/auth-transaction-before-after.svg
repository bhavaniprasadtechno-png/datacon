<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1180">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="40" y="34" fill="white" font-size="20" font-weight="700">Per-Request Auth: Before &#8594; After</text>
  <text x="40" y="54" fill="#94a3b8" font-size="11">Datacon API &#8212; collapsing 2 sequential Postgres transactions into 1 shared per-request transaction</text>

  <!-- ============================= BEFORE PANEL ============================= -->
  <rect x="40" y="90" width="1440" height="450" rx="12" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="60" y="115" fill="#fb7185" font-size="12" font-weight="600">BEFORE &#8212; two independent transactions, run one after the other</text>

  <!-- BEFORE row 1: request flow -->
  <!-- Client -->
  <path d="M 220 180 L 290 180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="70" y="150" width="150" height="60" rx="6" fill="#0f172a"/>
  <rect x="70" y="150" width="150" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="175" fill="white" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <text x="145" y="191" fill="#94a3b8" font-size="9" text-anchor="middle">click conversation</text>

  <!-- Guard -->
  <path d="M 480 180 L 550 180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="150" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="290" y="150" width="190" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="385" y="175" fill="white" font-size="11" font-weight="600" text-anchor="middle">SupabaseAuthGuard</text>
  <text x="385" y="191" fill="#94a3b8" font-size="9" text-anchor="middle">getClaims() + user lookup</text>

  <!-- Interceptor -->
  <path d="M 740 180 L 810 180" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="550" y="150" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="550" y="150" width="190" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="645" y="175" fill="white" font-size="11" font-weight="600" text-anchor="middle">OrgContextInterceptor</text>
  <text x="645" y="191" fill="#94a3b8" font-size="9" text-anchor="middle">stash orgId in ALS (no DB)</text>

  <!-- Service -->
  <rect x="810" y="150" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="810" y="150" width="190" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="905" y="175" fill="white" font-size="11" font-weight="600" text-anchor="middle">ConversationsService</text>
  <text x="905" y="191" fill="#94a3b8" font-size="9" text-anchor="middle">.scoped.findMany()</text>

  <!-- BEFORE row 2: two separate transactions -->
  <path d="M 385 210 L 385 260" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <path d="M 905 210 L 905 260" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <rect x="290" y="260" width="190" height="95" rx="6" fill="#0f172a"/>
  <rect x="290" y="260" width="190" height="95" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="385" y="283" fill="white" font-size="11" font-weight="600" text-anchor="middle">Transaction #1</text>
  <text x="385" y="298" fill="#94a3b8" font-size="8.5" text-anchor="middle">BEGIN &#8594; DEALLOCATE ALL</text>
  <text x="385" y="311" fill="#94a3b8" font-size="8.5" text-anchor="middle">&#8594; SELECT user &#8594; COMMIT</text>
  <text x="385" y="330" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">~340ms &#183; connection A</text>

  <rect x="810" y="260" width="190" height="95" rx="6" fill="#0f172a"/>
  <rect x="810" y="260" width="190" height="95" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="905" y="283" fill="white" font-size="11" font-weight="600" text-anchor="middle">Transaction #2</text>
  <text x="905" y="298" fill="#94a3b8" font-size="8.5" text-anchor="middle">BEGIN &#8594; DEALLOCATE ALL &#8594;</text>
  <text x="905" y="311" fill="#94a3b8" font-size="8.5" text-anchor="middle">SET_CONFIG &#8594; SELECT &#8594; COMMIT</text>
  <text x="905" y="330" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">~440ms &#183; connection B</text>

  <!-- BEFORE row 3: shared Postgres, reached twice -->
  <path d="M 385 355 L 385 385 L 630 385 L 630 400" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <path d="M 905 355 L 905 385 L 700 385 L 700 400" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <g transform="translate(560, 400)">
    <rect x="0" y="10" width="140" height="60" fill="#0f172a"/>
    <ellipse cx="70" cy="10" rx="70" ry="13" fill="#0f172a"/>
    <ellipse cx="70" cy="70" rx="70" ry="13" fill="#0f172a"/>
    <rect x="0" y="10" width="140" height="60" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="70" cy="10" rx="70" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="70" cy="70" rx="70" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="140" y1="10" x2="140" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="41" fill="white" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="70" y="54" fill="#94a3b8" font-size="8" text-anchor="middle">via PgBouncer</text>
  </g>

  <!-- BEFORE total callout -->
  <rect x="760" y="415" width="420" height="55" rx="6" fill="#0f172a"/>
  <rect x="760" y="415" width="420" height="55" rx="6" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="780" y="437" fill="white" font-size="11" font-weight="600">Total before first byte: ~780ms</text>
  <text x="780" y="453" fill="#94a3b8" font-size="9">2 sequential round trips, 2 separate connections</text>

  <!-- ============================= AFTER PANEL ============================= -->
  <rect x="40" y="570" width="1440" height="460" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="60" y="592" fill="#34d399" font-size="12" font-weight="600">AFTER &#8212; one shared transaction per request</text>

  <!-- AFTER row 1: request flow -->
  <path d="M 220 640 L 250 640" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="70" y="610" width="150" height="60" rx="6" fill="#0f172a"/>
  <rect x="70" y="610" width="150" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="145" y="635" fill="white" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <text x="145" y="651" fill="#94a3b8" font-size="9" text-anchor="middle">click conversation</text>

  <!-- shared-connection boundary wraps middleware -> guard -> interceptor -> service -->
  <rect x="240" y="596" width="850" height="88" rx="10" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="252" y="610" fill="#60a5fa" font-size="8" font-weight="600">ONE SHARED CONNECTION</text>

  <path d="M 480 640 L 500 640" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="618" width="220" height="60" rx="6" fill="#0f172a"/>
  <rect x="260" y="618" width="220" height="60" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="370" y="643" fill="white" font-size="10" font-weight="600" text-anchor="middle">RequestTxMiddleware</text>
  <text x="370" y="659" fill="#94a3b8" font-size="8.5" text-anchor="middle">opens ONE prisma.$transaction</text>

  <path d="M 690 640 L 710 640" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="618" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="500" y="618" width="190" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="595" y="643" fill="white" font-size="11" font-weight="600" text-anchor="middle">SupabaseAuthGuard</text>
  <text x="595" y="659" fill="#94a3b8" font-size="9" text-anchor="middle">runs on shared tx</text>

  <path d="M 900 640 L 920 640" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="710" y="618" width="190" height="60" rx="6" fill="#0f172a"/>
  <rect x="710" y="618" width="190" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="805" y="643" fill="white" font-size="11" font-weight="600" text-anchor="middle">OrgContextInterceptor</text>
  <text x="805" y="659" fill="#94a3b8" font-size="9" text-anchor="middle">stash orgId (no DB)</text>

  <rect x="920" y="618" width="150" height="60" rx="6" fill="#0f172a"/>
  <rect x="920" y="618" width="150" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="995" y="639" fill="white" font-size="10" font-weight="600" text-anchor="middle">Conversations-</text>
  <text x="995" y="652" fill="white" font-size="10" font-weight="600" text-anchor="middle">Service</text>
  <text x="995" y="666" fill="#94a3b8" font-size="8" text-anchor="middle">reuses shared tx</text>

  <!-- Excluded route note -->
  <rect x="1120" y="610" width="320" height="95" rx="6" fill="#0f172a"/>
  <rect x="1120" y="610" width="320" height="95" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1280" y="633" fill="white" font-size="11" font-weight="600" text-anchor="middle">Excluded: POST /chat/stream</text>
  <text x="1280" y="649" fill="#94a3b8" font-size="8.5" text-anchor="middle">SSE proxy can run 10s+ &#8212; kept on</text>
  <text x="1280" y="662" fill="#94a3b8" font-size="8.5" text-anchor="middle">today's per-call transactions;</text>
  <text x="1280" y="675" fill="#94a3b8" font-size="8.5" text-anchor="middle">never safe to hold one open</text>
  <text x="1280" y="688" fill="#94a3b8" font-size="8.5" text-anchor="middle">across a long stream</text>

  <!-- AFTER row 2: single transaction -->
  <path d="M 660 684 L 660 730" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="510" y="730" width="300" height="95" rx="6" fill="#0f172a"/>
  <rect x="510" y="730" width="300" height="95" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="660" y="753" fill="white" font-size="11" font-weight="600" text-anchor="middle">Shared Transaction</text>
  <text x="660" y="768" fill="#94a3b8" font-size="8.5" text-anchor="middle">BEGIN &#8594; SELECT user &#8594; SET_CONFIG (once)</text>
  <text x="660" y="781" fill="#94a3b8" font-size="8.5" text-anchor="middle">&#8594; SELECT conversations &#8594; COMMIT</text>
  <text x="660" y="800" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">~350&#8211;450ms &#183; 1 connection</text>

  <!-- AFTER row 3: Postgres -->
  <path d="M 660 825 L 660 855" fill="none" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <g transform="translate(590, 855)">
    <rect x="0" y="10" width="140" height="60" fill="#0f172a"/>
    <ellipse cx="70" cy="10" rx="70" ry="13" fill="#0f172a"/>
    <ellipse cx="70" cy="70" rx="70" ry="13" fill="#0f172a"/>
    <rect x="0" y="10" width="140" height="60" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="70" cy="10" rx="70" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="70" cy="70" rx="70" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="140" y1="10" x2="140" y2="70" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="41" fill="white" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="70" y="54" fill="#94a3b8" font-size="8" text-anchor="middle">via PgBouncer</text>
  </g>

  <!-- AFTER total callout -->
  <rect x="850" y="875" width="440" height="60" rx="6" fill="#0f172a"/>
  <rect x="850" y="875" width="440" height="60" rx="6" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="870" y="898" fill="white" font-size="11" font-weight="600">Total: ~350&#8211;450ms &#8212; 1 connection</text>
  <text x="870" y="915" fill="#34d399" font-size="10" font-weight="600">&#8776; 2&#215; faster than before (~780ms &#8594; ~400ms)</text>

  <!-- ============================= LEGEND ============================= -->
  <text x="60" y="1045" fill="#94a3b8" font-size="9" font-weight="600">LEGEND</text>

  <rect x="60" y="1055" width="14" height="14" rx="3" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="80" y="1066" fill="#cbd5e1" font-size="9">Client</text>

  <rect x="150" y="1055" width="14" height="14" rx="3" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="170" y="1066" fill="#cbd5e1" font-size="9">Guard / Service (business logic)</text>

  <rect x="410" y="1055" width="14" height="14" rx="3" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="1066" fill="#cbd5e1" font-size="9">Pass-through (no DB call)</text>

  <rect x="640" y="1055" width="14" height="14" rx="3" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="660" y="1066" fill="#cbd5e1" font-size="9">Old: blocking per-call transaction</text>

  <rect x="920" y="1055" width="14" height="14" rx="3" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="940" y="1066" fill="#cbd5e1" font-size="9">New: shared per-request transaction</text>

  <rect x="1210" y="1055" width="14" height="14" rx="3" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1230" y="1066" fill="#cbd5e1" font-size="9">Excluded route</text>

  <rect x="1350" y="1055" width="14" height="14" rx="3" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1370" y="1066" fill="#cbd5e1" font-size="9">Database</text>
</svg>
